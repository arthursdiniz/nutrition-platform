spring:
  application:
    name: nutrition-platform-api
  datasource:
    url: ${NUTRITION_DATABASE_URL:jdbc:postgresql://localhost:5433/nutrition}
    username: ${NUTRITION_DATABASE_USERNAME:nutrition}
    password: ${NUTRITION_DATABASE_PASSWORD:nutrition_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  error:
    include-message: never

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-minimum-32-byte-value}
    access-token-minutes: 15
    refresh-token-days: 30
  ai-provider: ${AI_PROVIDER:mock}
  subscription-provider: ${SUBSCRIPTION_PROVIDER:mock}
  storage-provider: ${STORAGE_PROVIDER:local}
